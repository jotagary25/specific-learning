# Dokploy "Docker Compose" deployment: one `app` container (api + built web).
# Dokploy writes the variables from its Environment tab to `.env` next to this file; `env_file`
# passes them to the container. Add the domain in Dokploy's Domains tab (service `app`, port
# 3000): Dokploy attaches the service to `dokploy-network` and adds the Traefik labels, so no
# host port is published here. See README "Deploying with Dokploy".
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      # Always UTC, whatever `.env` says: each user picks their own zone in Settings.
      TZ: UTC
    expose:
      - "3000"
    extra_hosts:
      # Lets DATABASE_URL use host.docker.internal for a PostgreSQL installed on the server.
      - "host.docker.internal:host-gateway"
