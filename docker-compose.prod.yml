# Production stack: one `app` container (api + built web) against your PostgreSQL 18
# (DATABASE_URL in `.env`).
#   docker compose -f docker-compose.prod.yml up -d --build
# Settings come from `.env`; see README "Environment variables".

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The container always listens on 3000.
      PORT: "3000"
      # Always UTC, whatever `.env` says: each user picks their own zone in Settings.
      TZ: UTC
    ports:
      # No defaults: both must be set in `.env`. Use APP_BIND=127.0.0.1 behind a reverse proxy,
      # or 0.0.0.0 to expose the app directly (and keep TRUST_PROXY off then).
      - "${APP_BIND:?Set APP_BIND in .env}:${APP_PORT:?Set APP_PORT in .env}:3000"
    extra_hosts:
      # Lets DATABASE_URL use host.docker.internal for a PostgreSQL installed on the host.
      - "host.docker.internal:host-gateway"
