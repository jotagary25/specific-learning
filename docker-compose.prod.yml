# Production stack for Dokploy (Docker Compose): one `app` container (api + built web).
# - Dokploy writes the Environment tab to `.env` next to this file; `env_file` passes it in.
# - Add the domain in Dokploy's Domains tab (service `app`, port 3000): Dokploy joins the service
#   to `dokploy-network` and adds the Traefik labels, so no host port is published here.
# - PostgreSQL 18: an existing server (DATABASE_URL) by default. Without one, enable the
#   `with-db` profile and point DATABASE_URL at host `db`.
# See README "Production deployment (Dokploy)".

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The container always listens on 3000.
      PORT: "3000"
      # Always UTC, whatever `.env` says: each user picks their own zone in Settings.
      TZ: UTC
    expose:
      - "3000"
    extra_hosts:
      # Lets DATABASE_URL use host.docker.internal for a PostgreSQL installed on the server.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:18
    profiles: [with-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-english}
      # Required with this profile: the postgres image refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-english_course}
      TZ: UTC
    volumes:
      # Named volume (Dokploy Volume Backups); postgres 18 keeps data under
      # /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
